services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: agentverdict
      POSTGRES_PASSWORD: agentverdict
      POSTGRES_DB: agentverdict
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentverdict -d agentverdict"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    environment:
      AGENTVERDICT_DATABASE_URL: postgresql+psycopg://agentverdict:agentverdict@db:5432/agentverdict
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
