# Alembic configuration for manual development use, e.g.:
#
#   alembic revision --autogenerate -m "add a column"
#   alembic upgrade head
#   alembic stamp head
#
# Run these from the repository root. Application code does not read this file:
# `agentverdict init-db` builds its config in agentverdict/migrate.py and runs
# `upgrade head` against the packaged migrations.

[alembic]
# Path to the migration environment (env.py, script.py.mako, versions/).
# It ships inside the package so migrations also work from an installed wheel.
script_location = src/agentverdict/migrations

# Prepended to sys.path; keeps the repo root importable for a source checkout.
prepend_sys_path = .

# Separator for the path-style options above (os.pathsep).
path_separator = os

# No database URL is configured here on purpose. env.py resolves it from the
# application settings — AGENTVERDICT_DATABASE_URL (or .env), defaulting to the
# local SQLite file — so the CLI, the tests, and this file target one database.
# Uncomment only to point a one-off alembic invocation somewhere else:
# sqlalchemy.url = sqlite:///./agentverdict.db


# Logging configuration, consumed by env.py via logging.config.fileConfig.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
